stages:
  - test
  - build
  - deploy

#----------------------------------------
# 공통 변수 정의 (원본과 동일)
variables:
  DOCKER_HOST: "tcp://docker:2375"
  DOCKER_TLS_CERTDIR: ""
  SSH_USER: "$SSH_USER"
  SSH_HOST: "$SSH_HOST"
  IMAGE: "$CI_REGISTRY_IMAGE"

#----------------------------------------
# 공통: Google Chat 알림 (기본: 실패시에만 전송, 배포잡에서는 always로 override)
.chat-notify:
  variables:
    CHAT_SEND_ON: "fail"   # 'fail' 또는 'always'
  after_script:
    - |
      [ -z "$CHAT_WEBHOOK_URL" ] && exit 0
      [ "$CHAT_SEND_ON" = "fail" ] && [ "$CI_JOB_STATUS" = "success" ] && exit 0

      # curl/jq 미설치 시 최소 설치
      (command -v curl >/dev/null 2>&1 && command -v jq >/dev/null 2>&1) || {
        (command -v apk >/dev/null 2>&1 && apk add --no-cache curl ca-certificates jq) || \
        (command -v apt-get >/dev/null 2>&1 && apt-get update -y >/dev/null && apt-get install -y curl ca-certificates jq) || \
        (command -v yum >/dev/null 2>&1 && yum -y install curl ca-certificates jq) || true
      }

      # 카드 메시지 전송 (cardsV2) - jq 사용, MR 파이프라인이면 MR 링크 우선
      [ "$CI_JOB_STATUS" = "success" ] && EMOJI="✅" || EMOJI="❌"
      TITLE="${EMOJI} ${CI_PROJECT_PATH}"
      SUBTITLE="${CI_JOB_STAGE}/${CI_JOB_NAME} ${CI_JOB_STATUS}"
      DETAILS="(branch: ${CI_COMMIT_REF_NAME}, commit: ${CI_COMMIT_SHORT_SHA})"
      SUMMARY="${EMOJI} ${CI_PROJECT_NAME} ${CI_JOB_NAME}"

      jq -n \
        --arg title "$TITLE" \
        --arg subtitle "$SUBTITLE" \
        --arg details "$DETAILS" \
        --arg summary "$SUMMARY" \
        --arg btn1_text "$BTN1_TEXT" \
        --arg j "$CI_PIPELINE_URL" \
        --arg k "$CI_JOB_URL" \
        '{
           fallbackText: $summary,
           cardsV2: [
             {
               cardId: "ci-notify",
               card: {
                 header: { title: $title, subtitle: $subtitle },
                 sections: [
                   {
                     widgets: [
                       { decoratedText: { text: $details } },
                       { buttonList: { buttons: [
                         { text: "파이프라인 열기", onClick: { openLink: { url: $j } } },
                         { text: "잡 열기", onClick: { openLink: { url: $k } } }
                       ] } }
                     ]
                   }
                 ]
               }
             }
           ]
         }' | curl -fsS -X POST -H "Content-Type: application/json; charset=UTF-8" --data-binary @- "$CHAT_WEBHOOK_URL" || true

#----------------------------------------

# Test Stage
test:
  extends: [.chat-notify]   # ← 실패 시 알림
  stage: test
  image: docker:24.0.2
  rules:
    - if: >-
        $CI_PIPELINE_SOURCE == "merge_request_event"
        && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"
    - when: never
  services:
    - name: docker:24.0.2-dind
      alias: docker
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
  script:
    - docker build -t $IMAGE:latest .


# Build Template
.build-template: &build-template
  stage: build
  image: docker:24.0.2
  services:
    - name: docker:24.0.2-dind
      alias: docker
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY

# main 브랜치에서 dev 빌드·푸시: SHA, dev 태그
build_dev:
  extends: [.chat-notify]   # ← 실패 시 알림
  <<: *build-template
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
    - when: never
  script:
    - docker build -t $IMAGE:dev .
    - docker push $IMAGE:dev

#----------------------------------------
# Deploy Template
.deploy-template: &deploy-template
  stage: deploy
  image: alpine:3.20
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY_B64" | base64 -d > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H $SSH_HOST >> ~/.ssh/known_hosts

# main 브랜치에서 dev 배포
deploy_dev:
  extends: [.chat-notify]   # ← 성공/실패 모두 알림
  variables:
    CHAT_SEND_ON: "always"
  <<: *deploy-template
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - when: never
  script:
    - |
      ssh $SSH_USER@$SSH_HOST "\
        docker compose --file /home/ant/workspace/pharmantech/pm-dev/front-compose.yml pull && \
        docker compose --file /home/ant/workspace/pharmantech/pm-dev/front-compose.yml up -d \
      "

# stage 태그 배포
deploy_stage:
  extends: [.chat-notify]
  variables:
    CHAT_SEND_ON: "always"
    ADAPTER: "sst"
    SST_TELEMETRY_DISABLED: "1"
    SST_NO_BUN: "1"
    PUBLIC_API_HOST: "$STAGE_API_HOST"
    PUBLIC_CDN_HOST: "$STAGE_CDN_HOST"
    PUBLIC_PARENT_DOMAIN: "$STAGE_PARENT_DOMAIN"
  stage: deploy
  image: node:20
  rules:
    - if: '$CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+-stage$/'
    - when: never
  before_script:
    - apt-get update -y
    - apt-get install -y unzip git python3 make g++
    - corepack enable
    - npm ci
  script:
    - npx sst deploy --stage stage --print-logs
  after_script:
    - |
      if [ "$CI_JOB_STATUS" != "success" ] && [ -f .sst/log/sst.log ]; then
        echo '===== SST LOG (deploy_prod) ====='
        cat .sst/log/sst.log
      fi

# production 태그 배포: SST로 AWS 배포
deploy_prod:
  extends: [.chat-notify]
  variables:
    CHAT_SEND_ON: "always"
    ADAPTER: "sst"
    SST_TELEMETRY_DISABLED: "1"
    SST_NO_BUN: "1"
    PUBLIC_API_HOST: "$PROD_API_HOST"
    PUBLIC_CDN_HOST: "$PROD_CDN_HOST"
    PUBLIC_PARENT_DOMAIN: "$PROD_PARENT_DOMAIN"
  stage: deploy
  image: node:20
  rules:
    - if: '$CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/'
    - when: never
  before_script:
    - apt-get update -y
    - apt-get install -y unzip git python3 make g++
    - corepack enable
    - npm ci
  script:
    - npx sst deploy --stage production --print-logs
  after_script:
    - |
      if [ "$CI_JOB_STATUS" != "success" ] && [ -f .sst/log/sst.log ]; then
        echo '===== SST LOG (deploy_prod) ====='
        cat .sst/log/sst.log
      fi
